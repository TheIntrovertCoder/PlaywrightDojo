<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			// Inline to avoid flash of wrong theme before JS loads.
			// Reads localStorage 'theme' and applies .dark / color-scheme immediately.
			(function () {
				try {
					var raw = localStorage.getItem('theme');
					var pref = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system';
					var isDark =
						pref === 'dark' ||
						(pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', isDark);
					document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
					document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
				} catch (e) {
					// localStorage unavailable; default to light
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
